name: Game Hub smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify game entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('index.html')
          assert root.is_file() and root.stat().st_size>100,'Homepage missing'
          games=[p for p in Path('.').rglob('index.html') if p!=root and '.git' not in p.parts]
          assert games,'No playable game entrypoints'
          broken=[str(p) for p in games if p.stat().st_size<100]
          assert not broken,f'Empty game pages: {broken[:20]}'
          print(f'Validated {len(games)} non-empty game entrypoints')
          PY
      - name: Verify portal classification and folders
        run: node scripts/check-game-classification.cjs
      - name: Check DONE game scripts, assets and catalog
        run: node scripts/qa-done.cjs
      - name: Horror games and asset integrity
        run: node scripts/check-horror-trio.mjs
      - name: Enhanced horror gameplay regression
        run: node tests/horror-upgrades-smoke.cjs
      - name: RTS capture, transport and building regression
        run: node tests/rts-simulation-smoke.cjs
      - name: Non-RTS game source and entrypoint regression
        run: node tests/non-rts-games-smoke.cjs
      - name: Three RTS waypoint and order tests
        run: node tests/three-rts-movement.cjs
      - name: Enemy durability regression
        run: node tests/enemy-durability-smoke.cjs
      - name: Install headless browser test runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate Racing JavaScript syntax
        run: |
          node --check "A Faire/_2D Racing/js/assets.js"
          node --check "A Faire/_2D Racing/js/assetLoader.js"
          node --check "A Faire/_2D Racing/js/script.js"
      - name: Validate game PNG assets and runtime mappings
        run: node tests/png-integration-smoke.cjs
      - name: Run actual browser catalog regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gamehub-http.log 2>&1 &
          sleep 2
          node tests/browser-portal-smoke.mjs
          node tests/racing-png-browser.mjs
          node tests/horror-upgrades-browser.mjs
