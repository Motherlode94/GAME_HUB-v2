name: Game Hub smoke checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify game entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('index.html')
          assert root.is_file() and root.stat().st_size>100,'Homepage missing'
          games=[p for p in Path('.').rglob('index.html') if p!=root and '.git' not in p.parts]
          assert games,'No playable game entrypoints'
          broken=[str(p) for p in games if p.stat().st_size<100]
          assert not broken,f'Empty game pages: {broken[:20]}'
          print(f'Validated {len(games)} non-empty game entrypoints')
          PY
      - name: Check DONE game scripts, assets and catalog
        run: node scripts/qa-done.cjs
      - name: Horror games and asset integrity
        run: node scripts/check-horror-trio.mjs
      - name: RTS capture, transport and building regression
        run: node tests/rts-simulation-smoke.cjs
      - name: Non-RTS game source and entrypoint regression
        run: node tests/non-rts-games-smoke.cjs
      - name: Three RTS waypoint and order tests
        run: node tests/three-rts-movement.cjs
      - name: Enemy durability regression
        run: node tests/enemy-durability-smoke.cjs
