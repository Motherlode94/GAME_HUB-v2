<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08111b">
    <link rel="stylesheet" href="../_shared/game-embed.css">
<title>Adventure Quest - Echoes of the Citadel</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<a class="hub-back" href="../index.html">&larr; HUB</a>
<div class="hud">
  <div class="hud-head">
    <p class="hud-kicker">Adventure Ops</p>
    <h1>Echoes of the Citadel</h1>
  </div>
  <div class="hud-bars">
    <div class="hud-bar-row">
      <span class="hud-bar-lbl">HP</span>
      <div class="hud-bar-track"><div class="hud-bar-fill hud-bar-hp-fill" id="hpBar"></div></div>
      <span class="hud-bar-val" id="hpVal">100</span>
    </div>
    <div class="hud-bar-row">
      <span class="hud-bar-lbl">SP</span>
      <div class="hud-bar-track"><div class="hud-bar-fill hud-bar-sp-fill" id="spBar"></div></div>
    </div>
  </div>
  <div class="hud-ribbon">
    <div class="hud-card" id="hudCardObjective">
      <span>Objective</span>
      <strong id="hudObjective">1/4</strong>
    </div>
    <div class="hud-card" id="hudCardThreat">
      <span>Threat</span>
      <strong id="hudThreat">LOW</strong>
    </div>
    <div class="hud-card" id="hudCardTempo">
      <span>Tempo</span>
      <strong id="hudTempo">FAST</strong>
    </div>
  </div>
  <div class="row">
    <span class="pill" data-k="T" id="timePill">0s</span>
    <span class="pill" data-k="S" id="scorePill">Score 0</span>
    <span class="pill" data-k="R" id="relicPill">Relic 0/1</span>
  </div>
  <div class="quest" id="questText">Quest: Speak with the Elder at the village center.</div>
  <div class="zone-label" id="zoneName">Village Woods</div>
  <div class="tip">WASD / Arrows - E Interact - Shift Sprint</div>
</div>
<div class="interact-hint" id="interactHint"></div>
<div class="message" id="msg"></div>
<canvas id="game" width="1280" height="720"></canvas>

<div class="mobile" id="mobileUi">
  <div class="joy" id="joy"><div class="joy-knob" id="joyKnob"></div></div>
  <button class="btn" id="actBtn" type="button">ACT</button>
</div>

<div class="end" id="endPanel">
  <div class="end-card">
    <h2 id="endTitle">Mission Complete</h2>
    <p id="endSub">You returned safely with the relic.</p>
    <div class="score" id="endScore">0</div>
    <div class="actions">
      <button id="retryBtn" type="button">Replay</button>
      <a href="../index.html">Back to Hub</a>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const hpBar      = document.getElementById('hpBar');
  const hpVal      = document.getElementById('hpVal');
  const spBar      = document.getElementById('spBar');
  const hudObjective = document.getElementById('hudObjective');
  const hudThreat = document.getElementById('hudThreat');
  const hudTempo = document.getElementById('hudTempo');
  const hudCardObjective = document.getElementById('hudCardObjective');
  const hudCardThreat = document.getElementById('hudCardThreat');
  const hudCardTempo = document.getElementById('hudCardTempo');
  const timePill   = document.getElementById('timePill');
  const scorePill  = document.getElementById('scorePill');
  const relicPill  = document.getElementById('relicPill');
  const questText  = document.getElementById('questText');
  const zoneLabel  = document.getElementById('zoneName');
  const interactHint = document.getElementById('interactHint');
  const msg        = document.getElementById('msg');
  const endPanel = document.getElementById('endPanel');
  const endTitle = document.getElementById('endTitle');
  const endSub = document.getElementById('endSub');
  const endScore = document.getElementById('endScore');
  const retryBtn = document.getElementById('retryBtn');

  const joy = document.getElementById('joy');
  const joyKnob = document.getElementById('joyKnob');
  const actBtn = document.getElementById('actBtn');

  const WORLD = { w: 2400, h: 1600 };
  const CAMERA = { x: 0, y: 0 };

  const blocks = [
    { x: 0, y: 0, w: WORLD.w, h: 120 },
    { x: 0, y: WORLD.h - 120, w: WORLD.w, h: 120 },
    { x: 0, y: 0, w: 120, h: WORLD.h },
    { x: WORLD.w - 120, y: 0, w: 120, h: WORLD.h },
    { x: 440, y: 420, w: 520, h: 120 },
    { x: 1320, y: 300, w: 110, h: 540 },
    { x: 760, y: 1080, w: 660, h: 110 },
    { x: 1540, y: 910, w: 500, h: 120 },
    { x: 360, y: 890, w: 180, h: 500 },
    { x: 1740, y: 1180, w: 420, h: 100 }
  ];

  const zones = [
    { x: 120, y: 120, w: 700, h: 560, c: '#16452f', n: 'Village Woods' },
    { x: 850, y: 120, w: 840, h: 620, c: '#3f3f2b', n: 'Dry Pass' },
    { x: 1220, y: 760, w: 920, h: 720, c: '#1e253f', n: 'Citadel Ruins' },
    { x: 170, y: 860, w: 850, h: 610, c: '#1c3b4f', n: 'Lake Path' }
  ];

  const state = {
    player: { x: 280, y: 300, r: 16, hp: 100, stamina: 1, speed: 170, sprint: 1.6 },
    keys: {},
    joy: { active: false, id: null, dx: 0, dy: 0 },
    startedAt: performance.now(),
    elapsed: 0,
    score: 0,
    hasKey: false,
    hasRelic: false,
    gateOpen: false,
    objective: 0,
    gameOver: false,
    won: false,
    elderTalked: false,
    lastHitAt: 0,
    interactDown: false
  };

  const actors = {
    elder: { x: 520, y: 300, r: 18, name: 'Elder' },
    gate: { x: 1410, y: 845, w: 110, h: 18 },
    key: { x: 960, y: 220, r: 12, taken: false },
    relic: { x: 1980, y: 1320, r: 14, taken: false },
    guards: [
      { x: 1180, y: 420, r: 14, t: 0, a: 106, b: 290, speed: 1.2, axis: 'x' },
      { x: 1860, y: 1050, r: 14, t: 1.5, a: 980, b: 1380, speed: 1.05, axis: 'y' },
      { x: 880, y: 1220, r: 14, t: 0.4, a: 760, b: 1380, speed: 0.95, axis: 'x' }
    ]
  };

  const quests = [
    'Quest: Speak with the Elder at the village center.',
    'Quest: Find the Citadel Key in the Dry Pass.',
    'Quest: Open the gate and recover the Lost Relic.',
    'Quest: Return to the Elder with the Relic.'
  ];

  function reset() {
    state.player.x = 280;
    state.player.y = 300;
    state.player.hp = 100;
    state.player.stamina = 1;
    state.startedAt = performance.now();
    state.elapsed = 0;
    state.score = 0;
    state.hasKey = false;
    state.hasRelic = false;
    state.gateOpen = false;
    state.objective = 0;
    state.gameOver = false;
    state.won = false;
    state.elderTalked = false;
    state.lastHitAt = 0;
    actors.key.taken = false;
    actors.relic.taken = false;
    endPanel.classList.remove('open');
    showMsg('New adventure started.');
  }

  function showMsg(text) {
    msg.textContent = text;
    msg.classList.add('show');
    clearTimeout(showMsg.t);
    showMsg.t = setTimeout(() => msg.classList.remove('show'), 1600);
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function dist(a, b, c, d) {
    const dx = a - c;
    const dy = b - d;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function circleHitsRect(cx, cy, r, rect) {
    const nx = clamp(cx, rect.x, rect.x + rect.w);
    const ny = clamp(cy, rect.y, rect.y + rect.h);
    return dist(cx, cy, nx, ny) <= r;
  }

  function movePlayer(dt) {
    const p = state.player;
    let vx = 0;
    let vy = 0;

    if (state.keys['w'] || state.keys['arrowup']) vy -= 1;
    if (state.keys['s'] || state.keys['arrowdown']) vy += 1;
    if (state.keys['a'] || state.keys['arrowleft']) vx -= 1;
    if (state.keys['d'] || state.keys['arrowright']) vx += 1;

    if (state.joy.active) {
      vx += state.joy.dx;
      vy += state.joy.dy;
    }

    const mag = Math.hypot(vx, vy) || 1;
    vx /= mag;
    vy /= mag;

    const wantSprint = state.keys['shift'] && state.player.stamina > 0;
    const run = wantSprint ? state.player.sprint : 1;
    if (wantSprint) {
      state.player.stamina = Math.max(0, state.player.stamina - dt * 0.65);
    } else {
      state.player.stamina = Math.min(1, state.player.stamina + dt * 0.38);
    }
    const sp = state.player.speed * run;
    const nx = p.x + vx * sp * dt;
    const ny = p.y + vy * sp * dt;

    // Axis collision pass
    p.x = clamp(nx, 120 + p.r, WORLD.w - 120 - p.r);
    for (const b of blocks) {
      if (circleHitsRect(p.x, p.y, p.r, b)) {
        if (vx > 0) p.x = b.x - p.r;
        if (vx < 0) p.x = b.x + b.w + p.r;
      }
    }

    p.y = clamp(ny, 120 + p.r, WORLD.h - 120 - p.r);
    for (const b of blocks) {
      if (circleHitsRect(p.x, p.y, p.r, b)) {
        if (vy > 0) p.y = b.y - p.r;
        if (vy < 0) p.y = b.y + b.h + p.r;
      }
    }

    if (!state.gateOpen && circleHitsRect(p.x, p.y, p.r, actors.gate)) {
      if (vy > 0) p.y = actors.gate.y - p.r;
      if (vy < 0) p.y = actors.gate.y + actors.gate.h + p.r;
    }
  }

  function updateGuards(dt) {
    for (const g of actors.guards) {
      g.t += dt * g.speed;
      const t = (Math.sin(g.t) + 1) * 0.5;
      if (g.axis === 'x') g.x = g.a + (g.b - g.a) * t;
      else g.y = g.a + (g.b - g.a) * t;

      if (dist(g.x, g.y, state.player.x, state.player.y) < g.r + state.player.r + 3) {
        if (performance.now() - state.lastHitAt > 900) {
          state.lastHitAt = performance.now();
          state.player.hp = Math.max(0, state.player.hp - 12);
          showMsg('Guard hit! HP -12');
          if (state.player.hp <= 0) {
            lose();
          }
        }
      }
    }
  }

  function handleInteract() {
    if (state.gameOver) return;

    const p = state.player;

    if (dist(p.x, p.y, actors.elder.x, actors.elder.y) < 52) {
      if (state.objective === 0) {
        state.elderTalked = true;
        state.objective = 1;
        showMsg('Elder: Find the key in Dry Pass.');
      } else if (state.objective === 3 && state.hasRelic) {
        win();
      } else {
        showMsg('Elder: Keep going, hero.');
      }
      return;
    }

    if (state.objective >= 1 && !actors.key.taken && dist(p.x, p.y, actors.key.x, actors.key.y) < 42) {
      actors.key.taken = true;
      state.hasKey = true;
      state.score += 140;
      state.objective = 2;
      showMsg('You found the Citadel Key!');
      return;
    }

    if (state.objective >= 2 && state.hasKey && !state.gateOpen && dist(p.x, p.y, actors.gate.x + actors.gate.w / 2, actors.gate.y + 8) < 62) {
      state.gateOpen = true;
      state.score += 120;
      showMsg('Gate unlocked. The ruins are open.');
      return;
    }

    if (state.gateOpen && !actors.relic.taken && dist(p.x, p.y, actors.relic.x, actors.relic.y) < 42) {
      actors.relic.taken = true;
      state.hasRelic = true;
      state.score += 220;
      state.objective = 3;
      showMsg('Lost Relic recovered! Return to Elder.');
      return;
    }
  }

  function lose() {
    state.gameOver = true;
    state.won = false;
    endTitle.textContent = 'Mission Failed';
    endSub.textContent = 'You were defeated before completing the quest.';
    endScore.textContent = String(finalScore());
    endPanel.classList.add('open');
    postScore(finalScore());
  }

  function win() {
    state.gameOver = true;
    state.won = true;
    endTitle.textContent = 'Mission Complete';
    endSub.textContent = 'You brought back the relic and saved the village.';
    endScore.textContent = String(finalScore());
    endPanel.classList.add('open');
    showMsg('Victory!');
    postScore(finalScore());
  }

  function finalScore() {
    const baseScore = Math.floor(state.score);
    const timeBonus = Math.max(0, 700 - Math.floor(state.elapsed));
    const hpBonus = state.player.hp * 5;
    return baseScore + timeBonus + hpBonus;
  }

  function postScore(score) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'gameScore', gameId: 13, score: score }, '*');
    }
  }

  function getCurrentZone() {
    const p = state.player;
    for (const z of zones) {
      if (p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h) return z.n;
    }
    return 'Wilderness';
  }

  function getInteractHint() {
    if (state.gameOver) return null;
    const p = state.player;
    if (dist(p.x, p.y, actors.elder.x, actors.elder.y) < 52)
      return state.hasRelic ? '[E] Parler à l\'Ancien — Retourner la Relique' : '[E] Parler à l\'Ancien';
    if (!actors.key.taken && state.objective >= 1 && dist(p.x, p.y, actors.key.x, actors.key.y) < 42)
      return '[E] Prendre la Clé de la Citadelle';
    if (state.hasKey && !state.gateOpen && dist(p.x, p.y, actors.gate.x + actors.gate.w / 2, actors.gate.y + 8) < 62)
      return '[E] Ouvrir le Portail';
    if (state.gateOpen && !actors.relic.taken && dist(p.x, p.y, actors.relic.x, actors.relic.y) < 42)
      return '[E] Prendre la Relique Perdue';
    return null;
  }

  function getObjectiveStep() {
    if (state.won || state.hasRelic) return 4;
    if (state.hasKey) return 3;
    if (state.elderTalked) return 2;
    return 1;
  }

  function getThreatLevel() {
    let nearest = Infinity;
    for (const g of actors.guards) {
      const d = dist(g.x, g.y, state.player.x, state.player.y);
      if (d < nearest) nearest = d;
    }

    let score = 0;
    if (nearest < 95) score += 2;
    else if (nearest < 180) score += 1;
    if (state.player.hp < 35) score += 2;
    else if (state.player.hp < 60) score += 1;
    if (performance.now() - state.lastHitAt < 1800) score += 1;

    if (score >= 3) return 'HIGH';
    if (score >= 1) return 'MED';
    return 'LOW';
  }

  function fmtClock(totalSeconds) {
    const sec = Math.max(0, Math.floor(totalSeconds));
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    return mm + ':' + ss;
  }

  function updateHud() {
    const hp = state.player.hp;
    hpBar.style.width = hp + '%';
    hpBar.style.background = hp < 30
      ? 'linear-gradient(90deg,#ff5f6d,#ff8060)'
      : hp < 60
        ? 'linear-gradient(90deg,#ffd166,#ff9e50)'
        : 'linear-gradient(90deg,#29d39e,#42a8ff)';
    hpVal.textContent = hp;
    spBar.style.width = Math.round(state.player.stamina * 100) + '%';

    const score = finalScore();
    const objectiveStep = getObjectiveStep();
    const threatLevel = getThreatLevel();
    const tempoLabel = state.elapsed < 120 ? 'FAST' : state.elapsed < 240 ? 'STD' : 'SLOW';

    timePill.textContent = Math.floor(state.elapsed) + 's';
    scorePill.textContent = 'Score ' + score.toLocaleString('fr-FR');
    relicPill.textContent = state.hasRelic ? 'Relic 1/1' : 'Relic 0/1';

    hudObjective.textContent = objectiveStep + '/4';
    hudThreat.textContent = threatLevel;
    hudTempo.textContent = tempoLabel + ' ' + fmtClock(state.elapsed);

    hudCardObjective.classList.toggle('is-done', objectiveStep >= 4);
    hudCardThreat.classList.remove('is-low', 'is-med', 'is-high');
    hudCardThreat.classList.add(threatLevel === 'HIGH' ? 'is-high' : threatLevel === 'MED' ? 'is-med' : 'is-low');
    hudCardTempo.classList.remove('is-fast', 'is-slow');
    if (tempoLabel === 'FAST') hudCardTempo.classList.add('is-fast');
    if (tempoLabel === 'SLOW') hudCardTempo.classList.add('is-slow');

    questText.textContent = (quests[state.objective] || quests[0]).replace('Quest: ', '');
    zoneLabel.textContent = getCurrentZone();

    const hint = getInteractHint();
    interactHint.textContent = hint || '';
    interactHint.classList.toggle('show', !!hint);
  }

  function updateCamera() {
    CAMERA.x = clamp(state.player.x - canvas.width * 0.5, 0, WORLD.w - canvas.width);
    CAMERA.y = clamp(state.player.y - canvas.height * 0.5, 0, WORLD.h - canvas.height);
  }

  function drawBackground() {
    ctx.fillStyle = '#0a1320';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-CAMERA.x, -CAMERA.y);

    for (const z of zones) {
      ctx.fillStyle = z.c;
      ctx.fillRect(z.x, z.y, z.w, z.h);
    }

    // Zone labels
    ctx.font = '700 12px "Exo 2", Arial';
    ctx.textAlign = 'center';
    for (const z of zones) {
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.fillText(z.n.toUpperCase(), z.x + z.w * 0.5, z.y + 22);
    }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < WORLD.w; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.h); ctx.stroke();
    }
    for (let y = 0; y < WORLD.h; y += 80) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.w, y); ctx.stroke();
    }

    // Walls with stone texture
    for (const b of blocks) {
      ctx.fillStyle = '#1e2d3f';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = 'rgba(255,255,255,0.07)';
      ctx.lineWidth = 1;
      for (let gx = b.x; gx < b.x + b.w; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, b.y); ctx.lineTo(gx, b.y + b.h); ctx.stroke();
      }
      for (let gy = b.y; gy < b.y + b.h; gy += 40) {
        ctx.beginPath(); ctx.moveTo(b.x, gy); ctx.lineTo(b.x + b.w, gy); ctx.stroke();
      }
    }

    // Gate
    if (!state.gateOpen) {
      ctx.fillStyle = '#5a1e28';
      ctx.fillRect(actors.gate.x, actors.gate.y, actors.gate.w, actors.gate.h);
      ctx.strokeStyle = '#9e3a4a';
      ctx.lineWidth = 2;
      const gx = actors.gate.x;
      const gy = actors.gate.y;
      const gw = actors.gate.w;
      const gh = actors.gate.h;
      for (let ix = gx + 10; ix < gx + gw; ix += 18) {
        ctx.beginPath(); ctx.moveTo(ix, gy); ctx.lineTo(ix, gy + gh); ctx.stroke();
      }
      drawLabel(gx + gw / 2, gy - 10, state.hasKey ? '🗝 Ouvrir [E]' : '🔒 Fermé');
    } else {
      ctx.strokeStyle = 'rgba(41,211,158,0.3)';
      ctx.lineWidth = 2;
      ctx.strokeRect(actors.gate.x, actors.gate.y, actors.gate.w, actors.gate.h);
    }

    // Elder
    drawEntity(actors.elder.x, actors.elder.y, actors.elder.r, '#ffd166', 'rgba(255,209,102,0.25)');
    drawLabel(actors.elder.x, actors.elder.y - actors.elder.r - 8, 'Ancien');

    // Key with pulse
    if (!actors.key.taken) {
      const kp = Math.abs(Math.sin(performance.now() * 0.004));
      ctx.beginPath();
      ctx.arc(actors.key.x, actors.key.y, actors.key.r * (1.8 + 0.5 * kp), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(132, 216, 255, ${0.14 * kp})`;
      ctx.fill();
      drawEntity(actors.key.x, actors.key.y, actors.key.r, '#84d8ff', 'rgba(132,216,255,0.2)');
      drawLabel(actors.key.x, actors.key.y - actors.key.r - 8, '🗝 Clé');
    }

    // Relic with rotating sparkle
    if (!actors.relic.taken) {
      const rp = performance.now() * 0.003;
      ctx.beginPath();
      ctx.arc(actors.relic.x, actors.relic.y, actors.relic.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(213,180,255,${0.12 + 0.06 * Math.sin(rp)})`;
      ctx.fill();
      ctx.save();
      ctx.translate(actors.relic.x, actors.relic.y);
      ctx.rotate(rp * 0.5);
      ctx.strokeStyle = 'rgba(213,180,255,0.3)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(0, actors.relic.r * 1.5);
        ctx.lineTo(0, actors.relic.r * 2.8);
        ctx.stroke();
        ctx.rotate(Math.PI / 2);
      }
      ctx.restore();
      drawEntity(actors.relic.x, actors.relic.y, actors.relic.r, '#d5b4ff', 'rgba(213,180,255,0.25)');
      drawLabel(actors.relic.x, actors.relic.y - actors.relic.r - 8, '🏺 Relique');
    }

    // Guards with danger aura and patrol indicator
    const now = performance.now();
    for (const g of actors.guards) {
      const pulse = 0.10 + 0.06 * Math.sin(now * 0.005 + g.t * 2);
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * 3.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,60,80,${pulse})`;
      ctx.fill();
      drawEntity(g.x, g.y, g.r, '#ff5f6d', 'rgba(255,60,80,0.15)');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('!', g.x, g.y + 3.5);
    }

    // Player with direction ring
    drawEntity(state.player.x, state.player.y, state.player.r, '#2fd6a8', 'rgba(47,214,168,0.22)');
    if (state.player.stamina < 0.3) {
      ctx.strokeStyle = `rgba(255,209,102,${0.5 + 0.4 * Math.sin(now * 0.01)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, state.player.r + 5, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Vignette pulse at low hp
    if (state.player.hp < 35) {
      const a = 0.12 + 0.06 * Math.sin(performance.now() * 0.01);
      ctx.fillStyle = 'rgba(255, 70, 80, ' + a.toFixed(3) + ')';
      ctx.fillRect(CAMERA.x, CAMERA.y, canvas.width, canvas.height);
    }

    ctx.restore();
  }

  function drawEntity(x, y, r, color, glowColor) {
    if (glowColor) {
      const g = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 2.4);
      g.addColorStop(0, glowColor);
      g.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    // Inner highlight
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fill();
    // Border
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawLabel(x, y, t) {
    const w = t.length * 5.6 + 12;
    ctx.font = '600 11px "Exo 2", Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(6,10,20,0.9)';
    ctx.beginPath();
    ctx.roundRect(x - w/2, y - 11, w, 17, 4);
    ctx.fill();
    ctx.fillStyle = '#cce4ff';
    ctx.fillText(t, x, y + 2);
  }

  function update(dt) {
    if (state.gameOver) return;

    state.elapsed = (performance.now() - state.startedAt) / 1000;

    movePlayer(dt);
    updateGuards(dt);

    if (state.score < 8000) {
      state.score += dt * 3.4;
    }

    updateCamera();
    updateHud();
  }

  function loop(ts) {
    const dt = Math.min(0.033, (ts - loop.last) / 1000 || 0.016);
    loop.last = ts;
    update(dt);
    drawBackground();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    state.keys[e.key.toLowerCase()] = true;
    if (e.key === 'E' || e.key === 'e') {
      if (!state.interactDown) {
        state.interactDown = true;
        handleInteract();
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    state.keys[e.key.toLowerCase()] = false;
    if (e.key === 'E' || e.key === 'e') {
      state.interactDown = false;
    }
  });

  canvas.addEventListener('mousedown', handleInteract);
  actBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteract(); }, { passive:false });
  actBtn.addEventListener('mousedown', (e) => { e.preventDefault(); handleInteract(); });

  retryBtn.addEventListener('click', reset);

  // Touch joystick
  joy.addEventListener('touchstart', onJoyStart, { passive:false });
  joy.addEventListener('touchmove', onJoyMove, { passive:false });
  joy.addEventListener('touchend', onJoyEnd, { passive:false });
  joy.addEventListener('touchcancel', onJoyEnd, { passive:false });

  function onJoyStart(e) {
    const t = e.changedTouches[0];
    state.joy.id = t.identifier;
    state.joy.active = true;
    updateJoyFromTouch(t);
    e.preventDefault();
  }

  function onJoyMove(e) {
    if (!state.joy.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === state.joy.id) {
        updateJoyFromTouch(t);
        break;
      }
    }
    e.preventDefault();
  }

  function onJoyEnd(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === state.joy.id) {
        state.joy.active = false;
        state.joy.id = null;
        state.joy.dx = 0;
        state.joy.dy = 0;
        joyKnob.style.left = '35px';
        joyKnob.style.top = '35px';
      }
    }
    e.preventDefault();
  }

  function updateJoyFromTouch(t) {
    const rect = joy.getBoundingClientRect();
    const cx = rect.left + rect.width * 0.5;
    const cy = rect.top + rect.height * 0.5;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const lim = 38;
    const m = Math.hypot(dx, dy);
    if (m > lim) {
      dx = dx / m * lim;
      dy = dy / m * lim;
    }

    joyKnob.style.left = (35 + dx) + 'px';
    joyKnob.style.top = (35 + dy) + 'px';
    state.joy.dx = dx / lim;
    state.joy.dy = dy / lim;
  }

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
