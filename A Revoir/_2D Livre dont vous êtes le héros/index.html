<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventure Médiévale - Quête du Royaume Perdu</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Medieval fonts for better atmosphere -->
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
    
    
    <link rel='stylesheet' href='../../css/game-shell.css'>
</head>
<body>
    <!-- Bouton Retour au Catalogue -->
    <button id="back-to-catalog" class="btn-back" aria-label="Retour au catalogue de jeux">
        <span class="back-icon">←</span>
        <span class="back-text">Retour au Catalogue</span>
    </button>

    <!-- Background audio (muted by default) -->
    <audio id="background-music" loop muted>
        <source src="https://assets.mixkit.co/music/preview/mixkit-medieval-showdown-829.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Sound effects -->
    <audio id="sword-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-metal-sword-slash-1493.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="click-sound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
    </audio>
    
    <div id="game-container">
        <!-- Game Header -->
        <div id="game-header">
            <h1 id="game-title"><i class="fas fa-crown"></i> Aventure Médiévale</h1>
            <div id="game-controls">
                <button id="music-toggle" class="control-btn" title="Musique">
                    <i class="fas fa-volume-mute"></i>
                </button>
                <button id="restart-btn" class="control-btn" title="Recommencer">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
        </div>
        
        <!-- Game Stats -->
        <div id="stats">
            <div class="stat-item">
                <span class="stat-icon">❤️</span>
                <span id="health">Santé: 100</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">💰</span>
                <span id="gold">Or: 0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⚔️</span>
                <span id="weapon">Arme: Aucune</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🛡️</span>
                <span id="armor">Armure: Aucune</span>
            </div>
        </div>
        
        <!-- Game Text Display -->
        <div id="text-container">
            <div id="text">Bienvenue, brave aventurier ! Votre quête commence dans la sombre forêt d'Elrendor...</div>
        </div>
        
        <!-- Player Inventory (collapsible) -->
        <div id="inventory-container">
            <button id="inventory-toggle" class="inventory-btn">
                <i class="fas fa-backpack"></i> Inventaire <span id="inventory-count">0</span>
            </button>
            <div id="inventory" class="inventory-collapsed">
                <div class="inventory-items">
                    <!-- Items will be added dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Game Options -->
        <div id="option-buttons" class="btn-grid">
            <!-- Buttons will be generated dynamically -->
        </div>
        
        <!-- Game Progress -->
        <div id="progress">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-text">Progression: 0%</div>
        </div>
        
        <!-- Game Footer -->
        <div id="game-footer">
            <p id="game-instruction">
                <i class="fas fa-info-circle"></i> Choisissez votre destin avec sagesse...
            </p>
            <p id="version">Version 1.0 · Quête du Royaume Perdu</p>
        </div>
    </div>
    
    <!-- Achievement Toast -->
    <div id="achievement-toast" class="hidden">
        <div class="toast-content">
            <span class="toast-icon">🏆</span>
            <div class="toast-text">
                <strong>Succès débloqué !</strong>
                <span id="achievement-text">Début de l'aventure</span>
            </div>
        </div>
    </div>
    
    <!-- ============================= -->
    <!-- SCRIPTS DU CATALOGUE -->
    <!-- ============================= -->
    <script src="../../js/config.js"></script>
    <script src="../../js/data.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/scores.js"></script>
    
    <!-- Script du jeu -->
    <script src="js/script.js"></script>
    
    <!-- Script du bouton retour -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const backBtn = document.getElementById('back-to-catalog');
            if (backBtn) {
                backBtn.addEventListener('click', () => {
                    // Chemin corrigé selon la structure de votre projet
                    window.location.href = '../../index.html';
                });
            }
        });
    </script>

<script src='../../js/game-shell.js'></script>
</body>
</html>
