<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Construction Simulator FPS</title><style>*{box-sizing:border-box}body{margin:0;background:#142230;color:#fff;font:14px system-ui;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}.ui{position:fixed;background:#0c1f30e9;border:1px solid #749bb2;border-radius:10px;padding:12px}#hud{top:10px;left:10px;pointer-events:none}#buttons{top:10px;right:10px;display:grid;gap:6px}button{background:#26516f;border:1px solid #89aabb;border-radius:6px;color:#fff;padding:10px;cursor:pointer}#note{bottom:30px;left:50%;transform:translateX(-50%)}#modal{display:none;inset:15%;z-index:5;overflow:auto}#modal.open{display:block}#modal button{margin:5px}.help{position:fixed;bottom:4px;left:6px;background:#142638e9;padding:8px}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}@media(max-width:650px){#modal{inset:5%}#buttons{top:auto;bottom:100px}}</style><canvas id="view"></canvas><div id="cross">＋</div><div id="hud" class="ui"><b>🏗️ CONSTRUCTION SIMULATOR FPS</b><p id="stats"></p><p id="goal"></p><p id="target"></p></div><div id="buttons" class="ui"><button id="mouse">🖱 Souris FPS</button><button id="use">E · Interagir</button><button id="build">🔨 Construire</button><button id="jobs">📋 Contrats</button><button id="save">💾 Sauvegarder</button></div><div id="note" class="ui">Approche-toi des matériaux et de la zone de chantier.</div><div id="modal" class="ui"></div><div class="help">ZQSD déplacer · Souris regarder · clic droit glissé : secours · E interagir · clic gauche construire · Tab contrats · V véhicule · Échap libérer</div><script>
'use strict';const c=document.querySelector('#view'),ctx=c.getContext('2d'),$=s=>document.querySelector(s),cl=(v,a,b)=>Math.max(a,Math.min(b,v));const items=[{x:4,y:3,icon:'🧱',name:'Matériaux',type:'supply'},{x:6,y:8,icon:'🪵',name:'Bois',type:'wood'},{x:9,y:4,icon:'🚜',name:'Chargeuse',type:'vehicle'},{x:13,y:7,icon:'🏗️',name:'Zone de chantier',type:'site'},{x:4,y:10,icon:'👷',name:'Chef de chantier',type:'boss'},{x:13,y:11,icon:'🏪',name:'Fournisseur',type:'store'}],contracts=[['Maison individuelle',4,1200],['Entrepôt',6,2300],['Atelier industriel',8,4000]];let G={x:3,y:6,a:0,money:1600,day:1,bricks:8,wood:5,step:0,contract:0,vehicle:false,completed:0},keys={},drag=false,lx=0,near=null;const block=(x,y)=>x<.55||y<.55||x>17.45||y>12.45;
function msg(t){$('#note').textContent=t}function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio}onresize=resize;resize();
function save(){try{localStorage.setItem('warlike-construction-fps',JSON.stringify(G));msg('Partie sauvegardée.')}catch{msg('Stockage indisponible.')}}function load(){try{const x=JSON.parse(localStorage.getItem('warlike-construction-fps'));if(x&&Number.isFinite(x.x)&&!block(x.x,x.y))G={...G,...x}}catch{}}
function dialog(title,body,choices){const d=$('#modal');d.replaceChildren();const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;d.append(h,p);for(const [name,fn] of choices){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{d.classList.remove('open');fn()};d.append(b)}const b=document.createElement('button');b.textContent='Fermer';b.onclick=()=>d.classList.remove('open');d.append(b);d.classList.add('open');document.exitPointerLock?.()}
function jobs(){const job=contracts[G.contract];dialog('📋 Contrats','Chantier : '+job[0]+' · étape '+(G.step+1)+'/'+job[1]+' · prime '+job[2]+' €. Termine les travaux pour gagner et débloquer le contrat suivant.',[['Journée suivante',()=>{G.day++;save();msg('Jour suivant.')}]])}
function buy(type,n,cost){if(G.money<cost)return msg('Trésorerie insuffisante.');G.money-=cost;G[type]+=n;save();msg('Livraison reçue.')}
function interact(){if(!near)return msg('Approche-toi des éléments.');switch(near.type){case 'supply':G.bricks+=2;msg('Briques récupérées.');break;case 'wood':G.wood+=2;msg('Planches récupérées.');break;case 'vehicle':G.vehicle=!G.vehicle;msg(G.vehicle?'Chargeuse activée.':'Chargeuse stationnée.');break;case 'site':build();break;case 'boss':jobs();break;case 'store':dialog('🏪 Fournisseur','Commande des ressources nécessaires à la construction.',[['5 briques : 150 €',()=>buy('bricks',5,150)],['5 planches : 125 €',()=>buy('wood',5,125)]]);break}}
function build(){const site=items.find(e=>e.type==='site');if(Math.hypot(G.x-site.x,G.y-site.y)>3)return msg('Rejoins le chantier pour construire.');const res=G.step%2?'wood':'bricks';if(G[res]<1)return msg('Ressource manquante : '+(res==='wood'?'bois':'briques'));G[res]--;G.step++;const job=contracts[G.contract];if(G.step>=job[1]){G.money+=job[2];G.completed++;G.day++;G.step=0;G.contract=(G.contract+1)%contracts.length;msg('🏆 Chantier achevé, prime '+job[2]+' € !')}else msg('Étape construite : '+G.step+'/'+job[1]);save()}
function draw(){const w=c.width,h=c.height;ctx.fillStyle='#a0b1c0';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#615e50';ctx.fillRect(0,h/2,w,h/2);const rays=cl(Math.floor(w/3),120,650),depth=new Float32Array(rays);for(let i=0;i<rays;i++){const off=Math.atan((i/rays-.5)*1.3),a=G.a+off;let d=.05;while(d<22&&!block(G.x+Math.cos(a)*d,G.y+Math.sin(a)*d))d+=.045;d*=Math.cos(off);depth[i]=d;const ht=Math.min(h*2,h/Math.max(.2,d)*1.3),shade=cl(170-d*12,35,170);ctx.fillStyle='rgb('+Math.floor(shade*.7)+','+Math.floor(shade*.8)+','+shade+')';ctx.fillRect(i*w/rays,h/2-ht/2,w/rays+1,ht)}for(const e of [...items].sort((a,b)=>Math.hypot(b.x-G.x,b.y-G.y)-Math.hypot(a.x-G.x,a.y-G.y))){const d=Math.hypot(e.x-G.x,e.y-G.y),off=(Math.atan2(e.y-G.y,e.x-G.x)-G.a+Math.PI*3)%(2*Math.PI)-Math.PI;if(d>18||Math.abs(off)>.65)continue;const x=(.5+Math.tan(off)/1.3)*w;if(depth[cl(Math.floor(x/w*rays),0,rays-1)]<d-.3)continue;const size=cl(h/d,20,h*.8);ctx.textAlign='center';ctx.font=size*.68+'px serif';ctx.fillText(e.icon,x,h/2+size*.2);ctx.font=Math.max(11,size*.13)+'px sans-serif';ctx.fillStyle='white';ctx.fillText(e.name,x,h/2+size*.4)}near=items.filter(e=>Math.hypot(e.x-G.x,e.y-G.y)<2.7).sort((a,b)=>Math.hypot(a.x-G.x,a.y-G.y)-Math.hypot(b.x-G.x,b.y-G.y))[0];$('#stats').textContent='Jour '+G.day+' · '+G.money+' € · 🧱 '+G.bricks+' · 🪵 '+G.wood+(G.vehicle?' · 🚜':'');$('#goal').textContent=contracts[G.contract][0]+' : '+G.step+'/'+contracts[G.contract][1];$('#target').textContent=near?'[E] '+near.name:'Explore le chantier.';ctx.fillStyle='#112c3be0';ctx.fillRect(w-165,h-140,155,130);for(const e of items){ctx.fillStyle='#ffd16d';ctx.fillRect(w-157+e.x*8,h-132+e.y*8,5,5)}ctx.fillStyle='#fff';ctx.fillRect(w-157+G.x*8,h-132+G.y*8,7,7)}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!$('#modal').classList.contains('open')){let f=Number(!!keys.z||!!keys.w)-Number(!!keys.s),st=Number(!!keys.d)-Number(!!keys.q||!!keys.a),n=Math.hypot(f,st)||1;const speed=(G.vehicle?5:2.8)*dt,dx=(f*Math.cos(G.a)-st*Math.sin(G.a))/n*speed,dy=(f*Math.sin(G.a)+st*Math.cos(G.a))/n*speed;if(!block(G.x+dx,G.y))G.x+=dx;if(!block(G.x,G.y+dy))G.y+=dy}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function turn(dx){G.a+=cl(dx,-120,120)*.003}c.oncontextmenu=e=>e.preventDefault();c.onpointerdown=e=>{if(e.button===2){drag=true;lx=e.clientX}else if(e.button===0)build()};addEventListener('pointerup',()=>drag=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===c)turn(e.movementX);else if(drag){turn(e.clientX-lx);lx=e.clientX}});c.onclick=()=>c.requestPointerLock?.().catch(()=>msg('Maintiens clic droit et déplace la souris.'));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Tab')e.preventDefault();if($('#modal').classList.contains('open'))return;if(e.key.toLowerCase()==='e')interact();if(e.key==='Tab')jobs();if(e.key.toLowerCase()==='v'&&near?.type==='vehicle')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>{keys={};drag=false});$('#mouse').onclick=()=>c.requestPointerLock?.().catch(()=>msg('Maintiens clic droit pour regarder.'));$('#use').onclick=interact;$('#build').onclick=build;$('#jobs').onclick=jobs;$('#save').onclick=save;load();
</script></html>
