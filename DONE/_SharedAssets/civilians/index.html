<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Civilian Pack</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#eaf1ff;background:#0a101e}header{padding:23px 6%;border-bottom:1px solid #2f4d66;background:linear-gradient(120deg,#1c304a,#101829)}h1{margin:0;font-size:28px}.muted{color:#a8bdcf}main{padding:22px 6%}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.card{background:#172437;border:1px solid #354e68;border-radius:12px;padding:11px}.portrait{height:146px;display:block;margin:auto;max-width:100%;object-fit:contain}.figure{height:176px;width:100%;object-fit:contain;image-rendering:auto}.tag{color:#71c3ef;font-size:11px;margin:4px 0}button,select{padding:10px 14px;border-radius:8px;border:1px solid #52728c;background:#234059;color:white;cursor:pointer}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.card strong{display:block;margin-top:8px}.card a{color:#b6e4ff;font-size:12px}img{user-select:none}.card small{color:#a6b8cd}</style></head><body><header><h1>WARLIKE · CIVILIAN PACK</h1><p class="muted">Personnages adultes originaux · Illustrations vectorielles SVG · Portraits + animation marche 2D</p><a href="../../../index.html" style="color:#cde6ff">← Game Hub</a></header><main><div class="toolbar"><label>Projet <select id="game"><option value="">Tous</option></select></label><label><input id="animate" type="checkbox" checked> Animation marche</label><span id="count" class="muted"></span></div><div id="grid"></div></main><script>fetch('manifest.json').then(r=>r.json()).then(data=>{const grid=document.getElementById('grid'),select=document.getElementById('game'),anim=document.getElementById('animate');[...new Set(data.characters.map(c=>c.game))].forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;select.append(o)});let cards=[];function show(){grid.replaceChildren();cards=[];data.characters.filter(c=>!select.value||c.game===select.value).forEach(c=>{const card=document.createElement('article');card.className='card';const portrait=document.createElement('img');portrait.className='portrait';portrait.src=c.portrait;portrait.alt='Portrait de '+c.name;const sprite=document.createElement('img');sprite.className='figure';sprite.src=c.idle;sprite.alt='Animation de '+c.name;const title=document.createElement('strong');title.textContent=c.name;const tag=document.createElement('div');tag.className='tag';tag.textContent=c.game;const a=document.createElement('a');a.href=c.idle;a.textContent='Sprite SVG';card.append(portrait,title,tag,sprite,a);grid.append(card);cards.push({sprite,c})});document.getElementById('count').textContent=cards.length+' civils affichés'}select.onchange=show;show();let frame=0;setInterval(()=>{if(!anim.checked)return;frame=(frame+1)%4;cards.forEach(({sprite,c})=>sprite.src=frame===0?c.idle:frame%2?c.walk1:c.walk2)},280)}).catch(e=>document.getElementById('grid').textContent='Impossible de charger le pack : '+e.message)</script></body></html>
