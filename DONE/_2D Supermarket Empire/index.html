<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#101924;color:#ecf5fa;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud,.tools,.notice,.modal{background:#0d1b2af5;border:1px solid #5b7c93;border-radius:11px;padding:12px}.hud{position:fixed;top:10px;left:10px;width:min(340px,75vw);pointer-events:none}.hud p{margin:5px 0}.tools{position:fixed;top:10px;right:10px;display:grid;gap:5px}button{border:1px solid #6896ba;color:white;background:#23435e;padding:9px;border-radius:7px;cursor:pointer}button:hover{background:#35688b}.notice{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);text-align:center}.modal{position:fixed;inset:10% 18%;display:none;overflow:auto;z-index:5}.modal.on{display:block}.modal button{margin:4px}.cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.help{position:fixed;bottom:5px;left:8px;background:#12283adb;padding:6px;border-radius:6px}.map{display:none}@media(max-width:640px){.tools{top:auto;bottom:70px}.modal{inset:5%}.hud{max-width:210px}}</style><canvas id="view"></canvas><div class="cross">＋</div><div class="hud"><strong id="title"></strong><p id="stats"></p><p id="target"></p></div><div class="tools"><button id="action">Interagir [E]</button><button id="menuBtn">Dossier / Gestion [Tab]</button><button id="saveBtn">💾 Sauvegarder</button><button id="mouseBtn">🖱 Souris FPS</button></div><div class="notice" id="notice">Déplace-toi dans le monde.</div><div id="touchPad" style="position:fixed;bottom:54px;right:12px;display:flex;gap:5px;z-index:2"><button data-move="z">▲</button><button data-move="q">◀</button><button data-move="s">▼</button><button data-move="d">▶</button><button id="turnL">↶</button><button id="turnR">↷</button></div><div class="help">ZQSD marcher · souris regarder · clic droit glissé si capture refusée · E interagir · Tab panneau · Échap libérer</div><div id="modal" class="modal"></div><div id="instructions" style="position:fixed;bottom:110px;left:12px;background:#102b3de0;padding:9px;border-radius:8px;max-width:285px;pointer-events:none">Commence par te diriger vers les icônes sur la mini-carte (en bas à droite). Clique sur Interagir dès qu'un objet est ciblé.</div><script>

let G={x:4,y:4,angle:0,money:850,week:1,rep:50,notes:[],stock:[],sales:0,score:0,caseIndex:0,flags:{},done:0},keys={},drag=false,mx=0,near=null;
const entities=[];let active=true;
function save(){try{localStorage.setItem('warlike-'+MODE+'-v1',JSON.stringify(G));message('Sauvegarde locale effectuée.')}catch{message('Stockage local indisponible.')}}function restore(){try{const s=JSON.parse(localStorage.getItem('warlike-'+MODE+'-v1'));if(s&&Number.isFinite(s.x))Object.assign(G,s);else message('Aucune sauvegarde.')}catch{message('Sauvegarde non lisible.')}}function message(t){el('notice').textContent=t}
function panel(title,body,actions){const m=el('modal');m.replaceChildren();const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=body;m.append(h,p);for(const [label,fn] of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{m.classList.remove('on');fn()};m.append(b)}const b=document.createElement('button');b.textContent='Fermer';b.onclick=()=>m.classList.remove('on');m.append(b);m.classList.add('on');document.exitPointerLock?.()}

c.fillStyle='#15293bdc';c.fillRect(w-148,h-135,140,125);for(const e of entities){c.fillStyle='#65d4f4';c.fillRect(w-140+e.x*8,h-130+e.y*8,5,5)}c.fillStyle='#fff';c.beginPath();c.arc(w-140+G.x*8,h-130+G.y*8,4,0,Math.PI*2);c.fill();c.strokeStyle='#fdf787';c.beginPath();c.moveTo(w-140+G.x*8,h-130+G.y*8);c.lineTo(w-140+(G.x+Math.cos(G.angle)*1.5)*8,h-130+(G.y+Math.sin(G.angle)*1.5)*8);c.stroke();}
let last=performance.now();function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!el('modal').classList.contains('on')){let f=Number(!!keys.z||!!keys.w||!!keys.ArrowUp)-Number(!!keys.s||!!keys.ArrowDown),s=Number(!!keys.d)-Number(!!keys.q||!!keys.a),n=Math.hypot(f,s)||1;f/=n;s/=n;const v=2.7*dt,dx=(Math.cos(G.angle)*f-Math.sin(G.angle)*s)*v,dy=(Math.sin(G.angle)*f+Math.cos(G.angle)*s)*v;if(!solid(G.x+dx,G.y))G.x+=dx;if(!solid(G.x,G.y+dy))G.y+=dy;if(keys.ArrowLeft)G.angle-=dt*1.8;if(keys.ArrowRight)G.angle+=dt*1.8;tick(dt)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
cv.oncontextmenu=e=>e.preventDefault();cv.onpointerdown=e=>{if(e.button===2){drag=true;mx=e.clientX}else if(e.button===0&&near)interact()};addEventListener('pointerup',()=>drag=false);addEventListener('mousemove',e=>{const dx=document.pointerLockElement===cv?e.movementX:(drag?e.clientX-mx:0);if(dx)G.angle+=cl(dx,-100,100)*.003;mx=e.clientX});cv.onclick=()=>{if(document.pointerLockElement!==cv)cv.requestPointerLock?.().catch(()=>message('Capture refusée : maintiens clic droit pour regarder.'))};el('mouseBtn').onclick=()=>cv.requestPointerLock?.().catch(()=>message('Maintiens le clic droit et glisse pour regarder.'));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.key]=true;if(['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(el('modal').classList.contains('on'))return;if(e.key.toLowerCase()==='e')interact();if(e.key==='Tab')dashboard()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false});addEventListener('blur',()=>{keys={};drag=false});document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===cv)message('Souris FPS activée. Échap pour libérer.');});document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[k]=false)});el('turnL').addEventListener('pointerdown',()=>keys.ArrowLeft=true);el('turnR').addEventListener('pointerdown',()=>keys.ArrowRight=true);['turnL','turnR'].forEach(id=>['pointerup','pointercancel','pointerleave'].forEach(event=>el(id).addEventListener(event,()=>{keys.ArrowLeft=false;keys.ArrowRight=false})));el('action').onclick=()=>interact();el('menuBtn').onclick=()=>dashboard();el('saveBtn').onclick=save;
const MODE='market';el('title').textContent='🛒 WARLIKE SUPERMARKET EMPIRE';const products=[{name:'Pain',buy:8,price:16},{name:'Lait',buy:9,price:18},{name:'Fruits',buy:7,price:15}];if(!Array.isArray(G.stock)||G.stock.length!==3)G.stock=[5,5,5];let clients=0,clock=0;entities.push({x:5,y:4,icon:'🥖',name:'Rayon pain',kind:'shelf',i:0},{x:7,y:4,icon:'🥛',name:'Rayon lait',kind:'shelf',i:1},{x:9,y:4,icon:'🍎',name:'Rayon fruits',kind:'shelf',i:2},{x:4,y:9,icon:'🧾',name:'Caisse',kind:'register'},{x:11,y:9,icon:'📦',name:'Réserve / fournisseurs',kind:'storage'},{x:12,y:3,icon:'🧑‍💼',name:'Employé',kind:'employee'});
