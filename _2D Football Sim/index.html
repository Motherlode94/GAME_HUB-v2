<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Awakening Football - Le foot dépasse ses limites</title>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet' href='../css/game-shell.css'>
</head>
<body>

    <div class="background-animation"></div>

    <!-- Bouton Retour Global -->
    <button class="btn-back" id="back-to-catalog" title="Retour au catalogue">
        <span class="back-icon">←</span>
        <span class="back-text">Retour</span>
    </button>

    <header>
        <div class="logo">
            <span class="logo-icon">⚽</span>
            <h1>Awakening Football</h1>
        </div>
        <p class="tagline">Le foot dépasse ses limites</p>
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-number">10</span>
                <span class="stat-label">Équipes</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">4</span>
                <span class="stat-label">Modes</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">∞</span>
                <span class="stat-label">Matchs</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="finalScore">0</span>
                <span class="stat-label">Score</span>
            </div>
        </div>
    </header>

    <main id="app">
        <section id="menu">
            <h2 class="menu-title">Choisis ton mode de jeu</h2>
            <div class="menu-grid">
                <button class="mode-btn" data-mode="exhibition">
                    <span class="mode-icon">🎮</span>
                    <span class="mode-name">Exhibition</span>
                    <span class="mode-desc">Match rapide entre deux équipes</span>
                </button>
                <button class="mode-btn" data-mode="career-team">
                    <span class="mode-icon">🏆</span>
                    <span class="mode-name">Carrière Équipe</span>
                    <span class="mode-desc">Crée ton équipe et domine</span>
                </button>
                <button class="mode-btn" data-mode="league">
                    <span class="mode-icon">🏅</span>
                    <span class="mode-name">Ligue</span>
                    <span class="mode-desc">Compétition complète</span>
                    <span class="coming-soon">Bientôt</span>
                </button>
                <button class="mode-btn" data-mode="career-player">
                    <span class="mode-icon">⭐</span>
                    <span class="mode-name">Carrière Joueur</span>
                    <span class="mode-desc">Deviens une légende</span>
                    <span class="coming-soon">Bientôt</span>
                </button>
            </div>
        </section>

        <section id="content">
            <div class="welcome-screen">
                <div class="welcome-icon">⚡</div>
                <h3>Prêt à jouer ?</h3>
                <p>Sélectionne un mode de jeu ci-dessus pour commencer ton aventure</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Awakening Football © 2025 | Propulsé par les Éveils</p>
    </footer>

    <!-- ============================= -->
    <!-- SCRIPTS DU CATALOGUE -->
    <!-- ============================= -->
    <script src="../js/config.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/scores.js"></script>

    <script src="script.js"></script>

    <script src='../js/game-shell.js'></script>
</body>
</html>
