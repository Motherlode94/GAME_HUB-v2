<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Survival</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- MENU -->
<div id="menu" class="overlay active">
  <div class="panel">
    <h1>Zombie Survival</h1>
    <p class="hint-text">ZQSD / Fleches pour bouger<br>Souris pour viser - Clic pour tirer</p>
    <button id="startBtn">Start Game</button>
    <a href="../../index.html" class="back-link">&larr; Retour Hub</a>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOver" class="overlay">
  <div class="panel">
    <h2>GAME OVER</h2>
    <p>Score final : <strong id="finalScore">0</strong></p>
    <button id="restartBtn">Recommencer</button>
    <a href="../../index.html" class="back-link">&larr; Retour Hub</a>
  </div>
</div>

<!-- HUD -->
<div class="hud">
  <div>HP <span id="hp">100</span></div>
  <div>Score <span id="score">0</span></div>
  <div>Vague <span id="wave">1</span></div>
  <span class="hint">ZQSD / Fleches - Clic pour tirer</span>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
