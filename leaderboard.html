<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard — Warlike Gaming Corps</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body class="lb-page">

    <header>
        <div class="header-inner">
            <p class="eyebrow">Warlike Gaming Corps</p>
            <h1>🏆 LEADER<span>BOARD</span></h1>
            <p class="subtitle">Hall of Fame — tous les meilleurs scores par jeu</p>
        </div>
        <div class="header-btns">
            <a href="index.html" class="header-lb-btn">← Catalogue</a>
            <a href="space.html" class="header-space-btn">🚀 Espace Joueur</a>
        </div>
    </header>

    <main class="container lb-main">

        <div class="lb-controls">
            <input type="text" id="lb-search" placeholder="🔍  Rechercher un jeu...">
            <select id="lb-sort">
                <option value="game">Par jeu (A→Z)</option>
                <option value="topscore">Meilleur score global</option>
                <option value="activity">+ Actif</option>
            </select>
            <button id="lb-clear-all" class="lb-danger-btn">🗑 Effacer mes données</button>
        </div>

        <div id="lb-summary" class="lb-summary"></div>
        <div id="lb-grid"    class="lb-grid"></div>
        <div id="lb-empty"   class="lb-empty-state hidden">
            <span>🏆</span>
            <p>Aucun score enregistré.</p>
            <small>Joue à un jeu — ton score sera enregistré automatiquement après ta session !</small>
            <a href="index.html" class="lb-play-link">Voir les jeux →</a>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Warlike Gaming Corps. All rights reserved.</p>
    </footer>

    <script src="js/leaderboard.js"></script>
</body>
</html>
